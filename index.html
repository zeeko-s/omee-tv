<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>omee tv</title>
<style>
  :root{--bg:#0e1116;--panel:#171c24;--line:#262d38;--text:#eef1f5;--mute:#8b95a5;--accent:#2ee6a6;--danger:#ff5b6e}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
  body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
  .logo{font-weight:800;font-size:20px;letter-spacing:.5px}.logo b{color:var(--accent)}
  .online{font-size:13px;color:var(--mute)}.online i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-inline-end:6px}
  main{flex:1;display:flex;flex-direction:column;min-height:0}
  .videos{flex:1;position:relative;background:#000;min-height:0}
  #remote{width:100%;height:100%;object-fit:cover;background:#000}
  #local{position:absolute;bottom:10px;inset-inline-start:10px;width:96px;height:132px;object-fit:cover;border-radius:12px;border:2px solid var(--line);background:#111;transform:scaleX(-1)}
  #status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--mute);font-size:16px;pointer-events:none}
  .chat{height:34%;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);min-height:0}
  #msgs{flex:1;overflow-y:auto;padding:10px 12px;font-size:15px;display:flex;flex-direction:column;gap:6px}
  .m{max-width:80%;padding:6px 10px;border-radius:12px;background:var(--line);word-break:break-word}
  .m.me{align-self:flex-start;background:var(--accent);color:#04281c}
  .m.sys{align-self:center;background:none;color:var(--mute);font-size:13px}
  .bar{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line)}
  .bar input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font-size:16px}
  button{border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:700;color:var(--text);background:var(--line);cursor:pointer}
  button.go{background:var(--accent);color:#04281c}
  button.rep{background:none;color:var(--danger);border:1px solid var(--danger)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}
  .gate .box{max-width:380px;text-align:center;display:flex;flex-direction:column;gap:16px}
  .gate h1{font-size:34px}.gate h1 b{color:var(--accent)}
  .gate p{color:var(--mute);line-height:1.7;font-size:15px}
  .gate label{display:flex;gap:10px;align-items:flex-start;text-align:start;font-size:14px;line-height:1.6}
  .gate button{padding:14px;font-size:17px}
  .gate button:disabled{opacity:.4}
  .hidden{display:none!important}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">
    <h1>omee <b>tv</b></h1>
    <p>تحدّث بالفيديو مع شخص عشوائي حول العالم.</p>
    <label><input type="checkbox" id="age"> أؤكد أن عمري 18 سنة أو أكثر</label>
    <label><input type="checkbox" id="rules"> أوافق على عدم نشر محتوى جنسي أو مسيء أو عنيف، وأن البلاغات قد تؤدي إلى حظري</label>
    <button class="go" id="start" disabled>ابدأ</button>
  </div>
</div>

<header>
  <div class="logo">omee <b>tv</b></div>
  <div class="online"><i></i><span id="count">0</span> متصل</div>
</header>

<main>
  <div class="videos">
    <video id="remote" autoplay playsinline></video>
    <video id="local" autoplay playsinline muted></video>
    <div id="status">اضغط «التالي» للبحث عن شخص</div>
  </div>
  <div class="chat">
    <div id="msgs"></div>
    <div class="bar">
      <input id="txt" placeholder="اكتب رسالة…" autocomplete="off" maxlength="500">
      <button id="send">إرسال</button>
    </div>
    <div class="bar">
      <button class="go" id="next" style="flex:1">التالي</button>
      <button id="stop">إيقاف</button>
      <button class="rep" id="report">إبلاغ</button>
    </div>
  </div>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const ageEl = $('age'), rulesEl = $('rules'), startBtn = $('start');
[ageEl, rulesEl].forEach(e => e.onchange = () => startBtn.disabled = !(ageEl.checked && rulesEl.checked));

let socket, pc, localStream, iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];
const remote = $('remote'), statusEl = $('status'), msgs = $('msgs');

function setStatus(t){ statusEl.textContent = t; statusEl.classList.toggle('hidden', !t); }
function addMsg(t, cls){ const d = document.createElement('div'); d.className = 'm ' + (cls||''); d.textContent = t; msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; }

startBtn.onclick = async () => {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
  } catch (e) {
    alert('يجب السماح بالكاميرا والميكروفون لاستخدام التطبيق.');
    return;
  }
  $('local').srcObject = localStream;
  $('gate').classList.add('hidden');
  try { const r = await fetch('/config'); iceServers = (await r.json()).iceServers; } catch (e) {}
  connect();
};

function connect(){
  socket = io();
  socket.on('online', n => $('count').textContent = n);
  socket.on('waiting', () => setStatus('جارٍ البحث عن شخص…'));
  socket.on('matched', ({ initiator }) => { setStatus('جارٍ الاتصال…'); msgs.innerHTML = ''; addMsg('تم العثور على شخص', 'sys'); startCall(initiator); });
  socket.on('signal', onSignal);
  socket.on('chat', t => addMsg(t));
  socket.on('partner-left', () => { closeCall(); addMsg('غادر الطرف الآخر', 'sys'); setStatus('غادر الطرف الآخر. اضغط «التالي»'); });
  socket.on('banned', () => { closeCall(); setStatus('تم حظرك مؤقتاً بسبب بلاغات.'); });
  socket.emit('find');
}

function closeCall(){
  if (pc) { pc.close(); pc = null; }
  remote.srcObject = null;
}

async function startCall(initiator){
  closeCall();
  pc = new RTCPeerConnection({ iceServers });
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = (e) => { remote.srcObject = e.streams[0]; setStatus(''); };
  pc.onicecandidate = (e) => { if (e.candidate) socket.emit('signal', { candidate: e.candidate }); };
  pc.onconnectionstatechange = () => {
    if (pc && pc.connectionState === 'failed') setStatus('فشل الاتصال. اضغط «التالي»');
  };
  if (initiator) {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('signal', { sdp: pc.localDescription });
  }
}

async function onSignal(d){
  if (!pc) return;
  try {
    if (d.sdp) {
      await pc.setRemoteDescription(d.sdp);
      if (d.sdp.type === 'offer') {
        const ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        socket.emit('signal', { sdp: pc.localDescription });
      }
    } else if (d.candidate) {
      await pc.addIceCandidate(d.candidate);
    }
  } catch (e) { console.error(e); }
}

$('next').onclick = () => { if (!socket) return; closeCall(); msgs.innerHTML = ''; setStatus('جارٍ البحث عن شخص…'); socket.emit('find'); };
$('stop').onclick = () => { if (!socket) return; socket.emit('leave'); closeCall(); setStatus('تم الإيقاف. اضغط «التالي» للبدء'); };
$('report').onclick = () => {
  if (!socket || !pc) return;
  socket.emit('report');
  addMsg('تم إرسال البلاغ', 'sys');
  $('next').click();
};
function send(){
  const t = $('txt').value.trim();
  if (!t || !pc) return;
  socket.emit('chat', t); addMsg(t, 'me'); $('txt').value = '';
}
$('send').onclick = send;
$('txt').onkeydown = (e) => { if (e.key === 'Enter') send(); };
</script>
</body>
</html>
