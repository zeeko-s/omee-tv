<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>omee tv</title>
<style>
:root{--bg:#0b0f14;--panel:#141a22;--line:#232c38;--text:#eef1f5;--mute:#8b95a5;--accent:#2ee6a6;--danger:#ff5b6e}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.hidden{display:none!important}
button,select,input{font:inherit;color:var(--text)}
button{border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.logo{font-weight:800;font-size:20px}.logo b{color:var(--accent)}

/* تسجيل الدخول */
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:22px}
.box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.box h1{font-size:36px;text-align:center}.box h1 b{color:var(--accent)}
.sub{text-align:center;color:var(--mute);font-size:14px;margin-bottom:4px}
.tabs{display:flex;background:var(--panel);border-radius:12px;padding:4px}
.tabs button{flex:1;padding:10px;border-radius:9px;background:none;color:var(--mute);font-weight:700}
.tabs button.on{background:var(--accent);color:#04281c}
.f{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;width:100%;font-size:16px}
.row{display:flex;gap:8px}
.chk{display:flex;gap:10px;font-size:13px;line-height:1.6;color:var(--mute)}
#msg{font-size:14px;min-height:20px;text-align:center;color:var(--danger)}#msg.ok{color:var(--accent)}
.go{background:var(--accent);color:#04281c;border-radius:12px;padding:14px;font-size:17px;font-weight:800}
.go:disabled{opacity:.5}

/* التطبيق */
#app{height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.right{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--mute)}
.right i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-inline-end:5px}
.out{background:none;color:var(--mute);font-size:13px;text-decoration:underline}
.videos{flex:1;position:relative;background:#000;min-height:0;overflow:hidden}
#remote{width:100%;height:100%;object-fit:cover}
#local{position:absolute;top:10px;inset-inline-start:10px;width:92px;height:128px;object-fit:cover;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:#111}
#local.mirror{transform:scaleX(-1)}
#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mute);pointer-events:none}
#pinfo{position:absolute;top:10px;inset-inline-end:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:6px 12px;border-radius:20px;font-size:14px}
.ctrls{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:0 10px}
.c{width:48px;height:48px;border-radius:50%;background:rgba(20,26,34,.75);backdrop-filter:blur(8px);font-size:21px;border:1px solid rgba(255,255,255,.12)}
.c.off{background:var(--danger)}
.c.rep{color:var(--danger)}
.next{flex:0 0 110px;border-radius:24px;background:var(--accent);color:#04281c;font-weight:800;font-size:16px;height:48px}
#filters{background:var(--panel);border-top:1px solid var(--line);padding:10px;display:flex;gap:8px}
#filters select{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.chat{height:30%;min-height:150px;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line)}
#msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.m{max-width:80%;padding:6px 11px;border-radius:14px;background:var(--line);word-break:break-word}
.m.me{align-self:flex-start;background:var(--accent);color:#04281c}
.m.sys{align-self:center;background:none;color:var(--mute);font-size:13px}
.bar{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line)}
.bar input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
.bar button{background:var(--line);border-radius:12px;padding:0 16px;font-weight:700}
</style>
</head>
<body>

<section class="auth" id="auth">
  <div class="box">
    <h1>omee <b>tv</b></h1>
    <p class="sub">تعرّف على أشخاص من كل العالم بالفيديو</p>
    <div class="tabs"><button id="tLogin" class="on">دخول</button><button id="tSign">حساب جديد</button></div>
    <div id="signOnly" class="hidden" style="display:flex;flex-direction:column;gap:12px">
      <input class="f" id="name" placeholder="الاسم الظاهر" maxlength="20">
      <div class="row">
        <select class="f" id="gender"><option value="">الجنس</option><option value="male">ذكر</option><option value="female">أنثى</option></select>
        <select class="f" id="country"></select>
      </div>
    </div>
    <input class="f" id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
    <input class="f" id="pw" type="password" placeholder="كلمة المرور (6 أحرف أو أكثر)" autocomplete="current-password">
    <label class="chk hidden" id="ageRow"><input type="checkbox" id="age"><span>أؤكد أن عمري 18 سنة أو أكثر، وأوافق على عدم نشر محتوى جنسي أو مسيء أو عنيف، وأن البلاغات قد تؤدي إلى حظري.</span></label>
    <div id="msg"></div>
    <button class="go" id="submit">دخول</button>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <div class="logo">omee <b>tv</b></div>
    <div class="right"><span><i></i><span id="count">0</span> متصل</span><button class="out" id="logout">خروج</button></div>
  </header>
  <div class="videos">
    <video id="remote" autoplay playsinline></video>
    <video id="local" class="mirror" autoplay playsinline muted></video>
    <div id="pinfo" class="hidden"></div>
    <div id="status">اضغط «التالي» للبحث عن شخص</div>
    <div class="ctrls">
      <button class="c" id="mic" aria-label="المايك">🎤</button>
      <button class="c" id="flip" aria-label="قلب الكاميرا">🔄</button>
      <button class="next" id="next">التالي</button>
      <button class="c" id="fbtn" aria-label="تصفية">⚙️</button>
      <button class="c rep" id="report" aria-label="إبلاغ">🚩</button>
    </div>
  </div>
  <div id="filters" class="hidden">
    <select id="fg"><option value="any">الكل (جنس)</option><option value="female">إناث فقط</option><option value="male">ذكور فقط</option></select>
    <select id="fc"></select>
  </div>
  <div class="chat">
    <div id="msgs"></div>
    <div class="bar"><input id="txt" placeholder="اكتب رسالة…" autocomplete="off" maxlength="500"><button id="send">إرسال</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let sb, socket, pc, stream, facing = 'user', mode = 'login', chain = Promise.resolve(), pend = [];
let ice = [{ urls: 'stun:stun.l.google.com:19302' }];
const names = {};

/* ---------- الدول ---------- */
const ARAB = ['SA','AE','EG','IQ','JO','KW','LB','LY','MA','DZ','TN','SD','SY','YE','OM','QA','BH','PS','MR','SO','DJ','KM'];
const EXC = new Set(['AC','CP','DG','EA','EU','EZ','IC','TA','UN','XA','XB','QO','ZZ','AN','BU','CS','DD','FX','NT','SU','TP','YD','YU','ZR','XK']);
const flag = (c) => c.replace(/./g, (ch) => String.fromCodePoint(127397 + ch.charCodeAt(0)));
function buildCountries() {
  const dn = new Intl.DisplayNames(['ar'], { type: 'region' });
  const rest = [];
  for (let i = 65; i <= 90; i++) for (let j = 65; j <= 90; j++) {
    const c = String.fromCharCode(i, j);
    if (EXC.has(c)) continue;
    let n; try { n = dn.of(c); } catch (e) { continue; }
    if (n && n !== c) { names[c] = n; if (!ARAB.includes(c)) rest.push(c); }
  }
  rest.sort((a, b) => names[a].localeCompare(names[b], 'ar'));
  const opt = (c) => `<option value="${c}">${flag(c)} ${names[c]}</option>`;
  const groups = `<optgroup label="الدول العربية">${ARAB.filter(c => names[c]).map(opt).join('')}</optgroup><optgroup label="باقي الدول">${rest.map(opt).join('')}</optgroup>`;
  $('country').innerHTML = '<option value="">الدولة</option>' + groups;
  $('fc').innerHTML = '<option value="any">كل الدول</option>' + groups;
}

/* ---------- الحساب ---------- */
function say(t, ok) { $('msg').textContent = t; $('msg').className = ok ? 'ok' : ''; }
function tr(m) {
  if (/confirm/i.test(m)) return 'فعّل بريدك أولاً من الرسالة التي وصلتك.';
  if (/invalid login/i.test(m)) return 'البريد أو كلمة المرور غير صحيحة.';
  if (/rate limit/i.test(m)) return 'محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة.';
  return 'حدث خطأ: ' + m;
}
function setMode(m) {
  mode = m;
  $('tLogin').classList.toggle('on', m === 'login');
  $('tSign').classList.toggle('on', m === 'sign');
  $('signOnly').classList.toggle('hidden', m !== 'sign');
  $('ageRow').classList.toggle('hidden', m !== 'sign');
  $('submit').textContent = m === 'sign' ? 'إنشاء حساب' : 'دخول';
  say('');
}
$('tLogin').onclick = () => setMode('login');
$('tSign').onclick = () => setMode('sign');

$('submit').onclick = async () => {
  const email = $('email').value.trim(), pw = $('pw').value;
  if (!email || pw.length < 6) return say('أدخل بريداً صحيحاً وكلمة مرور من 6 أحرف على الأقل.');
  $('submit').disabled = true;
  try {
    if (mode === 'sign') {
      const name = $('name').value.trim(), gender = $('gender').value, country = $('country').value;
      if (name.length < 2) return say('اكتب اسماً من حرفين على الأقل.');
      if (!gender || !country) return say('اختر الجنس والدولة.');
      if (!$('age').checked) return say('يجب تأكيد أن عمرك 18 سنة أو أكثر.');
      const { data, error } = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: location.origin, data: { name, gender, country } } });
      if (error) return say(tr(error.message));
      if (data.user && data.user.identities && data.user.identities.length === 0) return say('هذا البريد مسجّل مسبقاً، سجّل الدخول.');
      say('تم إنشاء الحساب. افتح بريدك واضغط رابط التفعيل، ثم سجّل الدخول.', true);
      setMode('login');
      say('تم إنشاء الحساب. افتح بريدك واضغط رابط التفعيل، ثم سجّل الدخول.', true);
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) return say(tr(error.message));
      enter();
    }
  } finally { $('submit').disabled = false; }
};
$('logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ---------- الكاميرا والمايك ---------- */
const getMedia = () => navigator.mediaDevices.getUserMedia({
  video: { facingMode: facing },
  audio: { echoCancellation: true, noiseSuppression: true },
});

$('mic').onclick = () => {
  const t = stream.getAudioTracks()[0];
  t.enabled = !t.enabled;
  $('mic').textContent = t.enabled ? '🎤' : '🔇';
  $('mic').classList.toggle('off', !t.enabled);
};

$('flip').onclick = async () => {
  try {
    const next = facing === 'user' ? 'environment' : 'user';
    const ns = await navigator.mediaDevices.getUserMedia({ video: { facingMode: next }, audio: false });
    const nt = ns.getVideoTracks()[0], old = stream.getVideoTracks()[0];
    old.stop(); stream.removeTrack(old); stream.addTrack(nt);
    facing = next;
    $('local').srcObject = stream;
    $('local').classList.toggle('mirror', facing === 'user');
    if (pc) { const s = pc.getSenders().find(x => x.track && x.track.kind === 'video'); if (s) await s.replaceTrack(nt); }
  } catch (e) { addMsg('تعذّر قلب الكاميرا على هذا الجهاز', 'sys'); }
};

/* ---------- الاتصال ---------- */
async function enter() {
  const { data } = await sb.auth.getSession();
  const s = data.session;
  if (!s || !s.user.email_confirmed_at) return;
  try { stream = await getMedia(); } catch (e) { return say('يجب السماح بالكاميرا والميكروفون لاستخدام التطبيق.'); }
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
  $('local').srcObject = stream;
  connect();
}

function setStatus(t) { $('status').textContent = t; $('status').classList.toggle('hidden', !t); }
function addMsg(t, cls) { const d = document.createElement('div'); d.className = 'm ' + (cls || ''); d.textContent = t; $('msgs').appendChild(d); $('msgs').scrollTop = 1e9; }

function connect() {
  socket = io({ auth: async (cb) => { const { data } = await sb.auth.getSession(); cb({ token: data.session && data.session.access_token }); } });
  socket.on('connect', find);
  socket.on('connect_error', (e) => {
    if (e.message === 'banned') return setStatus('تم حظرك مؤقتاً بسبب بلاغات.');
    if (e.message === 'auth') { sb.auth.signOut().then(() => location.reload()); }
  });
  socket.on('online', (n) => $('count').textContent = n);
  socket.on('waiting', () => setStatus('جارٍ البحث عن شخص…'));
  socket.on('matched', ({ initiator, partner }) => {
    setStatus('جارٍ الاتصال…');
    $('pinfo').textContent = (partner.country ? flag(partner.country) + ' ' : '') + partner.name + (names[partner.country] ? ' · ' + names[partner.country] : '');
    $('pinfo').classList.remove('hidden');
    $('msgs').innerHTML = ''; addMsg('تم العثور على ' + partner.name, 'sys');
    startCall(initiator);
  });
  socket.on('signal', (d) => { chain = chain.then(() => onSignal(d)).catch(console.error); });
  socket.on('chat', (t) => addMsg(t));
  socket.on('partner-left', () => { closeCall(); pend = []; $('pinfo').classList.add('hidden'); addMsg('غادر الطرف الآخر', 'sys'); setStatus('غادر الطرف الآخر. اضغط «التالي»'); });
  socket.on('banned', () => { closeCall(); setStatus('تم حظرك مؤقتاً بسبب بلاغات.'); });
}

function find() {
  closeCall(); pend = []; $('msgs').innerHTML = ''; $('pinfo').classList.add('hidden');
  setStatus('جارٍ البحث عن شخص…');
  socket.emit('find', { g: $('fg').value, c: $('fc').value });
}

function closeCall() { if (pc) { pc.close(); pc = null; } $('remote').srcObject = null; }

async function startCall(initiator) {
  closeCall();
  pc = new RTCPeerConnection({ iceServers: ice });
  stream.getTracks().forEach((t) => pc.addTrack(t, stream));
  pc.ontrack = (e) => { $('remote').srcObject = e.streams[0]; setStatus(''); };
  pc.onicecandidate = (e) => { if (e.candidate) socket.emit('signal', { candidate: e.candidate }); };
  pc.onconnectionstatechange = () => { if (pc && pc.connectionState === 'failed') setStatus('فشل الاتصال. اضغط «التالي»'); };
  if (initiator) {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('signal', { sdp: pc.localDescription });
  }
  const q = pend; pend = [];
  for (const d of q) chain = chain.then(() => onSignal(d)).catch(console.error);
}

async function onSignal(d) {
  if (!pc) { pend.push(d); return; }
  if (d.sdp) {
    await pc.setRemoteDescription(d.sdp);
    if (d.sdp.type === 'offer') {
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      socket.emit('signal', { sdp: pc.localDescription });
    }
  } else if (d.candidate) {
    await pc.addIceCandidate(d.candidate);
  }
}

$('next').onclick = () => socket && find();
$('fbtn').onclick = () => $('filters').classList.toggle('hidden');
$('fg').onchange = $('fc').onchange = () => { try { localStorage.setItem('f', JSON.stringify({ g: $('fg').value, c: $('fc').value })); } catch (e) {} };
$('report').onclick = () => { if (!socket || !pc) return; socket.emit('report'); addMsg('تم إرسال البلاغ', 'sys'); find(); };
function send() { const t = $('txt').value.trim(); if (!t || !pc) return; socket.emit('chat', t); addMsg(t, 'me'); $('txt').value = ''; }
$('send').onclick = send;
$('txt').onkeydown = (e) => { if (e.key === 'Enter') send(); };

/* ---------- البداية ---------- */
(async () => {
  buildCountries();
  try { const f = JSON.parse(localStorage.getItem('f') || '{}'); if (f.g) $('fg').value = f.g; if (f.c) $('fc').value = f.c; } catch (e) {}
  try {
    const cfg = await (await fetch('/config')).json();
    ice = cfg.iceServers;
    if (!cfg.supabaseUrl || !cfg.supabaseKey) return say('الإعدادات ناقصة: أضف SUPABASE_URL و SUPABASE_ANON_KEY في Render.');
    sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
    enter();
  } catch (e) { say('تعذّر الاتصال بالسيرفر.'); }
})();
</script>
</body>
</html>
